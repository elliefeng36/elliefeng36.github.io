<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chappystick — RSVP buttons</title>
  </head>
  <body>
    <template id="template-rsvp-buttons">
      <div class="rsvp-btn-group">
        <button
          type="button"
          class="btn btn-secondary btn-sm rsvp-btn"
          :class="{
            'rsvp-btn--selected': yourResponse === 'yes',
            'rsvp-btn--jump': jumpYes,
          }"
          :disabled="busyYes"
          @animationend="jumpYes = false"
          @click="onYes"
        >
          {{ compact ? "Yes" : "RSVP yes" }}
        </button>
        <button
          type="button"
          class="btn btn-ghost btn-sm rsvp-btn"
          :class="{
            'rsvp-btn--selected': yourResponse === 'no',
            'rsvp-btn--jump': jumpNo,
          }"
          :disabled="busyNo"
          @animationend="jumpNo = false"
          @click="onNo"
        >
          {{ compact ? "No" : "RSVP no" }}
        </button>
      </div>
    </template>
  </body>
</html>
