<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chappystick — home template</title>
  </head>
  <body>
    <template id="template-home">
      <div class="home-view">
        <section class="home-meetings">
          <div class="panel-head">
            <h3 class="panel-title">Your meetings</h3>
            <p class="panel-sub">Across every team you belong to</p>
          </div>
          <p v-if="areAllMeetingsLoading" class="muted loading-line">
            Loading meetings…
          </p>
          <template v-else>
            <ul
              v-if="homeMeetingsUpcoming.length"
              class="home-meetings-list"
            >
              <li
                v-for="row in homeMeetingsUpcoming"
                :key="row.object.url"
                class="home-meeting-row"
                :class="{
                  'meeting-row--editable-hover':
                    row.object.actor === $graffitiSession.value?.actor &&
                    row.object.value.meetingId,
                  'home-meeting-row--has-reminder':
                    hasUnreadReminderNotification(row.teamChannel),
                }"
              >
                <span
                  v-if="hasUnreadReminderNotification(row.teamChannel)"
                  class="meeting-notification-dot"
                  aria-label="Unread meeting reminder"
                  title="Unread meeting reminder"
                ></span>
                <div class="home-meeting-main">
                  <router-link
                    v-if="row.object.value.meetingId"
                    class="home-meeting-title-link"
                    :to="{
                      name: 'meeting',
                      params: { meetingID: row.object.value.meetingId },
                    }"
                  >
                    {{ row.object.value.name }}
                  </router-link>
                  <span v-else class="home-meeting-title">{{
                    row.object.value.name
                  }}</span>
                  <edit-meeting-button :meeting-object="row.object" />
                  <span class="home-meeting-when">{{
                    new Date(
                      row.object.value.startsAt ??
                        row.object.value.date ??
                        row.object.value.published,
                    ).toLocaleString(undefined, {
                      dateStyle: "medium",
                      timeStyle: "short",
                    })
                  }}</span>
                </div>
                <div class="home-meeting-meta">
                  <router-link
                    class="home-meeting-team-link"
                    :to="{ name: 'chat', params: { chatID: row.teamChannel } }"
                    >{{ row.teamTitle }}</router-link
                  >
                </div>
                <div
                  v-if="row.object.value.meetingId"
                  class="rsvp-row home-meeting-rsvp"
                >
                  <rsvp-buttons
                    compact
                    :your-response="
                      homeLatestOwnRsvp(row.object.value.meetingId)?.value
                        ?.response ?? null
                    "
                    :busy-yes="
                      homeMeetingRsvpBusy.has(
                        row.object.value.meetingId + ':yes',
                      )
                    "
                    :busy-no="
                      homeMeetingRsvpBusy.has(
                        row.object.value.meetingId + ':no',
                      )
                    "
                    @yes="
                      submitHomeMeetingRsvp(
                        row.object.value.meetingId,
                        'yes',
                        row.teamChannel,
                      )
                    "
                    @no="
                      submitHomeMeetingRsvp(
                        row.object.value.meetingId,
                        'no',
                        row.teamChannel,
                      )
                    "
                  />
                </div>
              </li>
            </ul>
            <details
              v-if="homeMeetingsPast.length"
              class="home-meetings-past-details"
            >
              <summary class="home-meetings-past-summary">
                Past meetings
                <span class="home-meetings-past-count">{{
                  homeMeetingsPast.length
                }}</span>
              </summary>
              <ul class="home-meetings-list home-meetings-list--past">
                <li
                  v-for="row in homeMeetingsPast"
                  :key="row.object.url"
                  class="home-meeting-row home-meeting-row--past"
                  :class="{
                    'meeting-row--editable-hover':
                      row.object.actor === $graffitiSession.value?.actor &&
                      row.object.value.meetingId,
                  }"
                >
                  <div class="home-meeting-main">
                    <router-link
                      v-if="row.object.value.meetingId"
                      class="home-meeting-title-link"
                      :to="{
                        name: 'meeting',
                        params: { meetingID: row.object.value.meetingId },
                      }"
                    >
                      {{ row.object.value.name }}
                    </router-link>
                    <span v-else class="home-meeting-title">{{
                      row.object.value.name
                    }}</span>
                    <edit-meeting-button :meeting-object="row.object" />
                    <span class="home-meeting-when">{{
                      new Date(
                        row.object.value.startsAt ??
                          row.object.value.date ??
                          row.object.value.published,
                      ).toLocaleString(undefined, {
                        dateStyle: "medium",
                        timeStyle: "short",
                      })
                    }}</span>
                  </div>
                  <div class="home-meeting-meta">
                    <router-link
                      class="home-meeting-team-link"
                      :to="{ name: 'chat', params: { chatID: row.teamChannel } }"
                      >{{ row.teamTitle }}</router-link
                    >
                  </div>
                  <div
                    v-if="row.object.value.meetingId"
                    class="rsvp-row home-meeting-rsvp"
                  >
                    <rsvp-buttons
                      compact
                      :your-response="
                        homeLatestOwnRsvp(row.object.value.meetingId)?.value
                          ?.response ?? null
                      "
                      :busy-yes="
                        homeMeetingRsvpBusy.has(
                          row.object.value.meetingId + ':yes',
                        )
                      "
                      :busy-no="
                        homeMeetingRsvpBusy.has(
                          row.object.value.meetingId + ':no',
                        )
                      "
                      @yes="
                        submitHomeMeetingRsvp(
                          row.object.value.meetingId,
                          'yes',
                          row.teamChannel,
                        )
                      "
                      @no="
                        submitHomeMeetingRsvp(
                          row.object.value.meetingId,
                          'no',
                          row.teamChannel,
                        )
                      "
                    />
                  </div>
                </li>
              </ul>
            </details>
            <p
              v-if="
                !homeMeetingsUpcoming.length && !homeMeetingsPast.length
              "
              class="muted"
            >
              No meetings yet.
            </p>
          </template>
        </section>

        <div class="main-empty">
          <p class="main-empty-title">No chat open</p>
          <p class="main-empty-text">
            Pick a team in the sidebar or open
            <code class="inline-code">/chat/&lt;team-id&gt;</code>.
          </p>
        </div>
      </div>
    </template>
  </body>
</html>
